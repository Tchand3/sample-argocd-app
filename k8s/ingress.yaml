# Ingress (Ensure it uses the correct path and backend)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: node-app-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx   # Ensuring it uses the NGINX ingress controller
  rules:
    - host: node-app.local  # Your domain or IP address
      http:
        paths:
          - path: /          # The path to route traffic
            pathType: Prefix  # Ensure correct path matching
            backend:
              service:
                name: node-app-service
                port:
                  number: 80  # Using port 80 because that's the port exposed o
